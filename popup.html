<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google Maps Remove Videos</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Google Maps Remove Videos</h1>
      <p>
        Diese Erweiterung blendet Videos in der Google-Maps-Bilderansicht aus
        und überspringt sie beim Weiterblättern mit den Pfeiltasten.
      </p>

      <label class="toggle-row">
        <span>
          <strong>Videos filtern</strong>
          <small id="statusText">Aktiv</small>
        </span>
        <input id="enabledToggle" type="checkbox" checked>
      </label>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
